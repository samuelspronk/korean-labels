<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A message for Mummy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html,body { margin:0; min-height:100%; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(165deg,#ffdcec 0%,#ffe7cf 55%,#fff5dc 100%);
    color:#7a2e57; display:flex; align-items:center; justify-content:center;
    min-height:100dvh; padding:22px; text-align:center;
  }
  .card {
    background:rgba(255,255,255,.78); backdrop-filter:blur(6px);
    border-radius:30px; padding:22px 20px 30px; max-width:380px; width:100%;
    box-shadow:0 20px 55px rgba(200,90,150,.30);
  }
  h1 { font-family:"Fredoka",sans-serif; font-weight:700; font-size:1.85rem;
       line-height:1.15; margin:.55rem 0 .15rem; }
  .sub { font-size:1rem; opacity:.75; margin:0 0 18px; }
  .name { font-family:"Fredoka",sans-serif; font-weight:600; }

  /* photo with play overlay */
  .photo {
    position:relative; width:100%; aspect-ratio:3/4; border-radius:22px;
    overflow:hidden; cursor:pointer; box-shadow:0 10px 26px rgba(122,46,87,.28);
    border:4px solid #fff;
  }
  .photo img { width:100%; height:100%; object-fit:cover; display:block;
               filter:grayscale(1) contrast(1.02); }
  .photo::after { /* soft darken at bottom so the button pops */
    content:""; position:absolute; inset:0;
    background:linear-gradient(to bottom,rgba(0,0,0,0) 55%,rgba(0,0,0,.28) 100%);
    pointer-events:none;
  }
  .play {
    position:absolute; left:50%; bottom:16px; transform:translateX(-50%);
    width:76px; height:76px; border-radius:50%; border:none; cursor:pointer;
    background:radial-gradient(circle at 35% 30%,#ff8fc4,#e75fa0); color:#fff;
    box-shadow:0 8px 22px rgba(231,95,160,.6); display:flex; align-items:center;
    justify-content:center; transition:transform .12s ease;
  }
  .play:active { transform:translateX(-50%) scale(.92); }
  .play .tri { font-size:1.9rem; line-height:1; margin-left:4px; }
  .play.playing .tri { margin-left:0; }
  .balloons { font-size:1.7rem; letter-spacing:.25rem; }
  .hint { font-size:.9rem; opacity:.65; margin-top:14px; min-height:1.2em; }
  audio { display:none; }
</style>
</head>
<body>
  <div class="card">
    <div class="balloons">🎈🎂🎈</div>

    <div class="photo" id="photo" role="button" aria-label="Play Goldie's message">
      <img src="goldie.jpg" alt="Goldie">
      <button class="play" id="btn" aria-label="Play">
        <span class="tri" id="tri">▶</span>
      </button>
    </div>

    <h1>Happy Birthday Mummy!</h1>
    <p class="sub">A little message from <span class="name">Goldie</span> 💛</p>
    <div class="hint" id="hint">tap the photo &middot; sound up 🔊</div>

    <audio id="a" preload="auto" playsinline src="goldie_only.m4a"></audio>
  </div>

<script>
  const a=document.getElementById('a'), btn=document.getElementById('btn'),
        photo=document.getElementById('photo'), tri=document.getElementById('tri'),
        hint=document.getElementById('hint');
  function set(p){ tri.textContent=p?'❚❚':'▶'; btn.classList.toggle('playing',p); }
  function toggle(){ a.paused ? a.play() : a.pause(); }
  photo.addEventListener('click', toggle);
  a.addEventListener('play', ()=>{ set(true); hint.textContent='playing… 💫'; });
  a.addEventListener('pause',()=>set(false));
  a.addEventListener('ended',()=>{ set(false); hint.textContent='tap to play again 💛'; });
  window.addEventListener('load', ()=>{ const p=a.play();
    if(p&&p.catch) p.catch(()=>{ hint.textContent='tap the photo · sound up 🔊'; }); });
</script>
</body>
</html>
