<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A message for Mummy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg,#ffd9ec 0%,#ffe9c7 55%,#fff4d6 100%);
    color:#7a2e57; display:flex; align-items:center; justify-content:center;
    min-height:100dvh; padding:24px; text-align:center;
  }
  .card {
    background: rgba(255,255,255,.72); backdrop-filter: blur(6px);
    border-radius:28px; padding:34px 26px 40px; max-width:420px; width:100%;
    box-shadow:0 18px 50px rgba(200,90,150,.28);
  }
  h1 { font-family:"Fredoka", sans-serif; font-weight:700; font-size:1.9rem; margin:.2rem 0 .1rem; }
  button.play, .name { font-family:"Fredoka", sans-serif; }
  .sub { font-size:1rem; opacity:.75; margin:0 0 22px; }
  .balloons { font-size:2.4rem; letter-spacing:.2rem; margin-bottom:6px; }
  button.play {
    border:none; cursor:pointer; width:150px; height:150px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ff8fc4,#e75fa0); color:#fff;
    box-shadow:0 12px 30px rgba(231,95,160,.5); font-size:1rem; font-weight:600;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px; margin:6px auto 4px; transition:transform .12s ease;
  }
  button.play:active { transform:scale(.94); }
  .tri { font-size:2.6rem; line-height:1; margin-bottom:2px; }
  .hint { font-size:.9rem; opacity:.65; margin-top:18px; min-height:1.2em; }
  audio { width:100%; margin-top:20px; }
  .name { font-weight:700; }
</style>
</head>
<body>
  <div class="card">
    <div class="balloons">🎈🎂🎈</div>
    <h1>Happy 40th, Mummy!</h1>
    <p class="sub">A little message from <span class="name">Goldie</span> 💛</p>

    <button class="play" id="btn" aria-label="Play message">
      <span class="tri" id="icon">▶</span>
      <span id="label">Tap to play</span>
    </button>

    <div class="hint" id="hint">turn your sound up 🔊</div>

    <audio id="a" preload="auto" playsinline src="goldie_only.m4a"></audio>
  </div>

<script>
  const a = document.getElementById('a');
  const btn = document.getElementById('btn');
  const icon = document.getElementById('icon');
  const label = document.getElementById('label');
  const hint = document.getElementById('hint');

  function setPlaying(p){
    icon.textContent = p ? '❚❚' : '▶';
    label.textContent = p ? 'Playing…' : 'Tap to play';
  }
  btn.addEventListener('click', () => {
    if (a.paused) { a.play(); } else { a.pause(); }
  });
  a.addEventListener('play',  () => setPlaying(true));
  a.addEventListener('pause', () => setPlaying(false));
  a.addEventListener('ended', () => { setPlaying(false); hint.textContent = 'Play it again 💫'; });

  // Try to autoplay on open; browsers usually need a tap, so the button is the fallback.
  window.addEventListener('load', () => {
    const p = a.play();
    if (p && p.catch) p.catch(() => { hint.textContent = 'tap the button, sound up 🔊'; });
  });
</script>
</body>
</html>
